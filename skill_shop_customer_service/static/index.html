<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商城专属在线智能客服</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei",sans-serif;
        }
        body{
            min-height:100vh;
            background: linear-gradient(135deg,#ff7eb3,#ff758c,#ffd29d,#84fab0,#8fd3f4);
            padding:24px 12px;
        }
        .container{
            max-width:1200px;
            margin:0 auto;
            display: grid;
            grid-template-columns:280px 1fr;
            gap:20px;
        }
        @media (max-width:768px){
            .container{
                grid-template-columns: 1fr;
            }
        }

        .sidebar{
            display:flex;
            flex-direction:column;
            gap:16px;
        }
        .card{
            background:#ffffff;
            border-radius:14px;
            padding:18px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
        }
        .card-title{
            font-size:16px;
            font-weight:bold;
            margin-bottom:12px;
            padding-bottom:8px;
            border-bottom: 2px solid #ff6b81;
            color:#222;
        }
        .faq-item{
            padding:8px 10px;
            background:linear-gradient(90deg,#fff1eb,#ffe8ec);
            border-radius:8px;
            margin-bottom:8px;
            cursor:pointer;
            font-size:13px;
            transition:0.2s;
        }
        .faq-item:hover{
            background:linear-gradient(90deg,#ffd6cc,#ffd8e0);
            transform:translateX(4px);
        }
        .history-item{
            padding:8px 6px;
            border-bottom:1px solid #eee;
            font-size:13px;
            color:#444;
            word-break: break-all;
            cursor:pointer;
        }

        .chat-wrap{
            background:#fff;
            border-radius:14px;
            overflow:hidden;
            box-shadow:0 4px 18px rgba(0,0,0,0.13);
            display:flex;
            flex-direction:column;
            height:620px;
        }
        .chat-header{
            background:linear-gradient(90deg,#ff5252,#ff4081);
            color:white;
            padding:18px 20px;
            font-size:19px;
            font-weight:500;
        }
        .chat-body{
            flex-grow:1;
            padding:18px;
            overflow-y:auto;
            background-color:#fef8fa;
        }
        .msg{
            margin-bottom:16px;
            max-width:82%;
            line-height:1.65;
            padding:11px 15px;
            border-radius:20px;
            font-size:15px;
        }
        .msg-user{
            margin-left:auto;
            background:linear-gradient(120deg,#42a5f5,#2196f3);
            color:#fff;
        }
        .msg-service{
            margin-right:auto;
            background:linear-gradient(120deg,#e8f5e9,#c8e6c9);
            color:#1a1a1a;
        }
        .chat-footer{
            display:flex;
            gap:12px;
            padding:16px;
            background:#f8f8f8;
        }
        #inputText{
            flex:1;
            padding:13px 18px;
            border:1px solid #ddd;
            border-radius:24px;
            font-size:15px;
            outline:none;
        }
        #sendBtn{
            padding:11px 28px;
            border-radius:24px;
            border:none;
            background:linear-gradient(90deg,#ff4081,#f50057);
            color:#ffffff;
            cursor:pointer;
            font-size:15px;
        }
        #sendBtn:hover{
            opacity:0.88;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="sidebar">
        <div class="card">
            <div class="card-title">✨ 热门咨询</div>
            <div class="faq-item" onclick="sendQuick('什么时候发货？')">什么时候发货？</div>
            <div class="faq-item" onclick="sendQuick('我的订单号是多少')">我的订单号是多少</div>
            <div class="faq-item" onclick="sendQuick('如何申请退货退款')">如何申请退货退款</div>
            <div class="faq-item" onclick="sendQuick('商品可以开发票吗')">商品可以开发票吗</div>
            <div class="faq-item" onclick="sendQuick('可以修改收货地址吗')">可以修改收货地址吗</div>
            <div class="faq-item" onclick="sendQuick('快递多久能够送达')">快递多久能够送达</div>
        </div>
        <div class="card">
            <div class="card-title">📜 查询历史提问</div>
            <div id="historyBox"></div>
        </div>
    </div>

    <div class="chat-wrap">
        <div class="chat-header">商城专属在线智能客服</div>
        <div class="chat-body" id="chatBox"></div>
        <div class="chat-footer">
            <input type="text" id="inputText" placeholder="请输入您想要咨询的问题">
            <button id="sendBtn">发送</button>
        </div>
    </div>
</div>

<script>
    const apiUrl = "/skill/shop_service/chat";
    const chatBox = document.getElementById("chatBox");
    const inputText = document.getElementById("inputText");
    const sendBtn = document.getElementById("sendBtn");
    const historyBox = document.getElementById("historyBox");

    if (!localStorage.getItem("sessionId")) {
        localStorage.setItem("sessionId", crypto.randomUUID())
    }
    const sid = localStorage.getItem("sessionId");
    const openId = "customer_001";

    let queryHistory = JSON.parse(localStorage.getItem("queryHistory")||"[]");

    function renderHistory(){
        historyBox.innerHTML = "";
        queryHistory.forEach(item=>{
            let div = document.createElement("div");
            div.className = "history-item";
            div.innerText = item;
            div.onclick = ()=>{
                inputText.value = item;
            }
            historyBox.appendChild(div);
        })
    }
    renderHistory();

    function sendQuick(text){
        inputText.value = text;
        sendChat();
    }

    function addMessage(text, isUser){
        const div = document.createElement("div");
        div.className = isUser ? "msg msg-user" : "msg msg-service";
        div.innerText = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendChat(){
        let text = inputText.value.trim();
        if(!text) return;
        addMessage(text,true);
        inputText.value = "";

        if(!queryHistory.includes(text)){
            queryHistory.unshift(text);
            if(queryHistory.length>12) queryHistory.pop();
            localStorage.setItem("queryHistory",JSON.stringify(queryHistory));
            renderHistory();
        }

        try{
            const res = await fetch(apiUrl,{
                method:"POST",
                headers:{"Content-Type":"application/json"},
                body:JSON.stringify({
                    session_id:sid,
                    user_openid:openId,
                    user_query:text
                })
            })
            if (!res.ok) throw new Error('请求失败');
            const data = await res.json();
            addMessage(data.response,false);
        }catch (err){
            console.error(err);
            addMessage("网络异常，请稍后重试",false);
        }
    }

    sendBtn.onclick = sendChat;
    inputText.addEventListener("keydown",e=>{
        if(e.key === "Enter") sendChat();
    })
</script>
</body>
</html>
